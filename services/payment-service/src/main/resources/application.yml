spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:payment_local}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: payment-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        interceptor.classes: com.bazaar.payment.messaging.TraceProducerInterceptor
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      max-poll-records: 20
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      auto-startup: false
      missing-topics-fatal: false
      observation-enabled: true
      shutdown-timeout: 10s
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,diskSpace,ping
        kafka:
          include: kafkaBroker
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${BAZAAR_ENV:local}

bazaar:
  payment:
    events-topic: ${PAYMENT_EVENTS_TOPIC:bazaar.payment.events}
    commands-topic: ${PAYMENT_COMMANDS_TOPIC:bazaar.payment.commands}
  security:
    jwt:
      remote: true
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/bazaar}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8088/realms/bazaar/protocol/openid-connect/certs}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    stale: ${OUTBOX_STALE:30s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  dlq:
    topic: ${DLQ_TOPIC:bazaar.dlq}
