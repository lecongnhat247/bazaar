spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:payment_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: payment-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: false
      missing-topics-fatal: false
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,diskSpace,ping
        kafka:
          include: kafkaBroker

logging:
  structured:
    format:
      console: ecs

bazaar:
  payment:
    events-topic: ${PAYMENT_EVENTS_TOPIC:bazaar.payment.events}
    commands-topic: ${PAYMENT_COMMANDS_TOPIC:bazaar.payment.commands}
  security:
    jwt:
      remote: true
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/bazaar}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8088/realms/bazaar/protocol/openid-connect/certs}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    stale: ${OUTBOX_STALE:30s}
