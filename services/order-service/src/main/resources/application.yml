spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: order-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        interceptor.classes: com.bazaar.order.messaging.TraceProducerInterceptor
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      auto-startup: false
      missing-topics-fatal: false
      observation-enabled: true
    admin:
      fail-fast: false

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,diskSpace,ping
        kafka:
          include: kafkaBroker
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${BAZAAR_ENV:local}

bazaar:
  security:
    jwt:
      remote: true
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/bazaar}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8088/realms/bazaar/protocol/openid-connect/certs}
  order:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    events-topic: ${ORDER_EVENTS_TOPIC:bazaar.order.events}
    inventory-events-topic: ${INVENTORY_EVENTS_TOPIC:bazaar.inventory.events}
    payment-events-topic: ${PAYMENT_EVENTS_TOPIC:bazaar.payment.events}
    inventory-commands-topic: ${INVENTORY_COMMANDS_TOPIC:bazaar.inventory.commands}
    payment-commands-topic: ${PAYMENT_COMMANDS_TOPIC:bazaar.payment.commands}
  saga:
    recover-delay: ${SAGA_RECOVER_DELAY:15000}
    resend-after: ${SAGA_RESEND_AFTER:PT20S}
    give-up-after: ${SAGA_GIVE_UP_AFTER:PT2M}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    stale: ${OUTBOX_STALE:30s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  dlq:
    topic: ${DLQ_TOPIC:bazaar.dlq}
