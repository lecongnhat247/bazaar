# Local kind values. Image names match the tags produced by docker compose build.
# Leave registry empty so the chart uses those local tags. A remote cluster sets
# registry, tag, pullPolicy, and imagePullSecrets in a separate values file.

replicaCount: 1

image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

# Names of Secrets that already exist in the namespace. The chart does not create them.
imagePullSecrets: []

# Optional Secret whose keys become environment variables. Create it in the cluster.
# Phase 1 has no credentials to put in Git.
envFromSecret: ""

# Set during an upgrade to roll every pod without changing the image.
revision: ""

java:
  terminationGracePeriodSeconds: 30
  toolOptions: "-XX:MaxRAMPercentage=75.0"

storefront:
  terminationGracePeriodSeconds: 20

# Local kind stays at one replica. Raising maxReplicas is a remote decision:
# six database services use 10 connections each, and Kafka topics have 3 partitions.
autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 70

# A PodDisruptionBudget is rendered only for a service whose minimum is at least 2.
podDisruptionBudget:
  enabled: true

# The chart does not install an ingress controller. Enable this on a cluster that has one.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  paths:
    - path: /
      service: storefront
      port: 3000
    - path: /api
      service: api-gateway
      port: 8080

resources:
  java:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storefront:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# Non-sensitive addresses. Kubernetes DNS names match the Compose service names.
config:
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  API_GATEWAY_URL: http://api-gateway:8080
  IDENTITY_SERVICE_URL: http://identity-service:8080
  CATALOG_SERVICE_URL: http://catalog-service:8080
  INVENTORY_SERVICE_URL: http://inventory-service:8080
  ORDER_SERVICE_URL: http://order-service:8080
  PAYMENT_SERVICE_URL: http://payment-service:8080
  NOTIFICATION_URL: http://notification-service:8080
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  CORS_ORIGIN: http://localhost:3000

applications:
  api-gateway:
    image: bazaar-api-gateway
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: true
    env:
      - SERVER_PORT
      - CORS_ALLOWED_ORIGINS
      - IDENTITY_SERVICE_URL
      - CATALOG_SERVICE_URL
      - INVENTORY_SERVICE_URL
      - ORDER_SERVICE_URL
      - PAYMENT_SERVICE_URL
  identity-service:
    image: bazaar-identity-service
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - SERVER_PORT
  catalog-service:
    image: bazaar-catalog-service
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - SERVER_PORT
  inventory-service:
    image: bazaar-inventory-service
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - SERVER_PORT
  order-service:
    image: bazaar-order-service
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - SERVER_PORT
  payment-service:
    image: bazaar-payment-service
    port: 8080
    runtime: java
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - SERVER_PORT
  storefront:
    image: bazaar-storefront
    port: 3000
    runtime: node
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: true
    env:
      - API_GATEWAY_URL
      - NOTIFICATION_URL
      - PORT
      - HOSTNAME
  notification-service:
    image: bazaar-notification-service
    port: 8080
    runtime: node
    probes: notification
    scale:
      minReplicas: 1
      maxReplicas: 1
      cpu: false
    env:
      - CORS_ORIGIN
