{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $app := .Values.applications }}
{{- $scale := $app.scale | default dict }}
{{- $min := int ($scale.minReplicas | default 1) }}
{{- if gt $min 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bazaar.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "bazaar.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
