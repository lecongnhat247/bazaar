{{- if .Values.autoscaling.enabled }}
{{- range $name, $app := .Values.applications }}
{{- $scale := $app.scale | default dict }}
{{- $min := int ($scale.minReplicas | default 1) }}
{{- $max := int ($scale.maxReplicas | default $min) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bazaar.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $min }}
  maxReplicas: {{ $max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- if not $scale.cpu }}
  behavior:
    scaleUp:
      selectPolicy: Disabled
    scaleDown:
      selectPolicy: Disabled
  {{- end }}
{{- end }}
{{- end }}
