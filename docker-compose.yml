name: bazaar

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar_local
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_local
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8088
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_APPEND: "-Xmx512m"
    ports:
      - "8088:8080"
    volumes:
      - ./infrastructure/keycloak/bazaar-realm.json:/opt/keycloak/data/import/bazaar-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - bazaar

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: bazaar-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: bazaar-identity-service
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: bazaar-catalog-service
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    image: bazaar-inventory-service
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: bazaar-order-service
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      CATALOG_SERVICE_URL: http://catalog-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: bazaar-payment-service
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    image: bazaar-storefront
    ports:
      - "3000:3000"
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8088
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - bazaar

networks:
  bazaar:
    name: bazaar

volumes:
  postgres-data:
    name: bazaar-postgres-data
