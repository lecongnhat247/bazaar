name: bazaar

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar_local
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_local
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8088
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_APPEND: "-Xmx512m"
    ports:
      - "8088:8080"
    volumes:
      - ./infrastructure/keycloak/bazaar-realm.json:/opt/keycloak/data/import/bazaar-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - bazaar

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: bazaar-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: bazaar-identity-service
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: identity_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: bazaar-catalog-service
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    image: bazaar-inventory-service
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: bazaar-order-service
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      CATALOG_SERVICE_URL: http://catalog-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: bazaar-payment-service
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_local
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - bazaar

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    image: bazaar-storefront
    ports:
      - "3000:3000"
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8088
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      NOTIFICATION_URL: http://notification-service:8080
      NOTIFICATION_PUBLIC_URL: http://localhost:8086
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - bazaar

  notification-db-init:
    image: postgres:17.11-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: bazaar_local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! psql -h postgres -U bazaar -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='notification_user'" | grep -q 1; then
          psql -h postgres -U bazaar -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE notification_user LOGIN PASSWORD 'notification_local'"
        fi
        if ! psql -h postgres -U bazaar -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='notification_db'" | grep -q 1; then
          psql -h postgres -U bazaar -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE notification_db OWNER notification_user"
        fi
    mem_limit: 128m
    restart: "no"
    networks:
      - bazaar

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: bazaar-notification-service
    ports:
      - "8086:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://notification_user:notification_local@postgres:5432/notification_db
      KAFKA_BROKERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER: http://localhost:8088/realms/bazaar
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/bazaar/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      notification-db-init:
        condition: service_completed_successfully
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - bazaar

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - bazaar

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - bazaar

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        for topic in bazaar.order.events bazaar.inventory.events bazaar.payment.events bazaar.catalog.events bazaar.inventory.commands bazaar.payment.commands; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=3600000 --config retention.bytes=67108864
        done
    mem_limit: 256m
    restart: "no"
    networks:
      - bazaar

networks:
  bazaar:
    name: bazaar

volumes:
  postgres-data:
    name: bazaar-postgres-data
  kafka-data:
    name: bazaar-kafka-data
