name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test the services
        run: chmod +x mvnw && ./mvnw -B test

  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install, test, lint, and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  notification:
    name: Notification service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Helm 4.3.1
        run: |
          curl -fsSL "https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz" -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Lint the chart
        run: helm lint infrastructure/helm/bazaar

      - name: Check release tags and render an immutable tag
        run: |
          bash infrastructure/scripts/test-release-tag.sh
          tag="sha-$(printf 'a%.0s' {1..40})"
          rendered="$(bash infrastructure/scripts/deploy.sh --render "$tag")"
          printf '%s\n' "$rendered" | grep -F "bazaar-api-gateway:${tag}"
          printf '%s\n' "$rendered" | grep -F "bazaar-notification-service:${tag}"
          if printf '%s\n' "$rendered" | grep -F ':latest'; then
            echo "The rendered chart still contains the latest tag."
            exit 1
          fi

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit the storefront
        working-directory: apps/storefront
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit the notification service
        working-directory: services/notification-service
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Report high filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
          version: v0.67.2
          timeout: 15m
          skip-dirs: .git,apps/storefront/node_modules,services/notification-service/node_modules

      - name: Fail on critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.67.2
          timeout: 15m
          skip-dirs: .git,apps/storefront/node_modules,services/notification-service/node_modules

  images:
    name: Image ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: identity-service
            dockerfile: services/identity-service/Dockerfile
          - name: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - name: inventory-service
            dockerfile: services/inventory-service/Dockerfile
          - name: order-service
            dockerfile: services/order-service/Dockerfile
          - name: payment-service
            dockerfile: services/payment-service/Dockerfile
          - name: storefront
            dockerfile: apps/storefront/Dockerfile
          - name: notification-service
            dockerfile: services/notification-service/Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false
          outputs: type=oci,dest=${{ github.workspace }}/image.tar

      - name: Report high image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: ${{ github.workspace }}/image.tar
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
          version: v0.67.2
          timeout: 15m

      - name: Fail on critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: ${{ github.workspace }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.67.2
          timeout: 15m
