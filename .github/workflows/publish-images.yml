name: Publish images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra immutable tag, sha-<40 hex> or vX.Y.Z. Leave empty to publish the commit tag, and latest on main.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: identity-service
            dockerfile: services/identity-service/Dockerfile
          - name: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - name: inventory-service
            dockerfile: services/inventory-service/Dockerfile
          - name: order-service
            dockerfile: services/order-service/Dockerfile
          - name: payment-service
            dockerfile: services/payment-service/Dockerfile
          - name: storefront
            dockerfile: apps/storefront/Dockerfile
          - name: notification-service
            dockerfile: services/notification-service/Dockerfile
    steps:
      - name: Refuse an untrusted pull request
        if: github.event_name == 'pull_request' || github.event.pull_request.head.repo.fork == true
        run: |
          echo "Pull requests do not publish images. Fork pull requests are untrusted."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Refuse a mutable extra tag
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          source infrastructure/scripts/release-tag.sh
          reject_release_tag "$EXTRA_TAG"

      - name: Image name
        id: image
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/bazaar-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          provenance: false
          tags: bazaar-${{ matrix.name }}:scan

      - name: Report high image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bazaar-${{ matrix.name }}:scan
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          scanners: vuln
          version: v0.67.2
          timeout: 15m

      - name: Fail on critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bazaar-${{ matrix.name }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          version: v0.67.2
          timeout: 15m

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: bazaar-${{ matrix.name }}:scan
        run: |
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then
              continue
            fi
            docker tag "$SOURCE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
