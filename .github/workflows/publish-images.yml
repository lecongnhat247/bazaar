name: Publish images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra image tag. Leave empty to publish the git SHA, and latest on main.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - name: identity-service
            dockerfile: services/identity-service/Dockerfile
          - name: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - name: inventory-service
            dockerfile: services/inventory-service/Dockerfile
          - name: order-service
            dockerfile: services/order-service/Dockerfile
          - name: payment-service
            dockerfile: services/payment-service/Dockerfile
          - name: storefront
            dockerfile: apps/storefront/Dockerfile
          - name: notification-service
            dockerfile: services/notification-service/Dockerfile
    steps:
      - name: Refuse an untrusted pull request
        if: github.event_name == 'pull_request' || github.event.pull_request.head.repo.fork == true
        run: |
          echo "Pull requests do not publish images. Fork pull requests are untrusted."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Image name
        id: image
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/bazaar-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
